name: Supabase Keep-Alive Ping

on:
  schedule:
    # Se ejecuta cada 3 días a las 08:00 UTC (evita el límite de 7 días)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Permite disparo manual desde la pestaña Actions de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -f -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
               -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
               "https://qitboisspvnfbazvndnq.supabase.co/rest/v1/exercises?select=id&limit=1" \
               > /dev/null
          echo "✅ Supabase ping exitoso - Base de datos activa."
